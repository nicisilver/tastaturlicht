# dkms.conf – Bauplan für DKMS 🚀
#
# DKMS baut meinen Treiber automatisch neu, wenn Ubuntu einen neuen
# Linux-Kern installiert, und unterschreibt ihn mit meinem MOK-Schlüssel.

PACKAGE_NAME="pink_tastatur"
PACKAGE_VERSION="1.0"

# Welcher Treiber entsteht und wohin er kommt
BUILT_MODULE_NAME[0]="pink_tastatur"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# So wird gebaut und aufgeräumt
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# Bei jedem neuen Linux-Kern automatisch neu bauen
AUTOINSTALL="yes"
